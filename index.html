<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Interactive API reliability dashboard demo."><title>Traceboard — API Reliability</title><style>:root{--bg:#071014;--panel:#0e1c21;--ink:#ecfbfb;--muted:#91adae;--cyan:#4be7dc;--line:#214047;--amber:#ffbd62;--red:#ff7083}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 100% 0,#0d505244,transparent 35%),var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui}.app{max-width:1180px;margin:auto;padding:25px}.top{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:18px}.brand{font-weight:800;font-size:1.25rem;letter-spacing:-.04em}.brand i{font-style:normal;color:var(--cyan)}.top small{color:var(--muted)}h1{font-size:clamp(2.4rem,5vw,4.5rem);line-height:.96;letter-spacing:-.07em;margin:54px 0 12px}.lead{color:var(--muted);max-width:590px;font-size:1.08rem}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:35px 0 18px}.metric,.feed{background:#0b191ed9;border:1px solid var(--line);border-radius:13px;padding:18px}.metric small{color:var(--muted)}.metric b{display:block;font-size:1.8rem;margin-top:5px}.feed h2{font-size:1rem;margin:0 0 14px}.filters{display:flex;gap:8px;margin-bottom:10px}.filter,.replay{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:7px;padding:7px 10px;cursor:pointer}.filter.active{border-color:var(--cyan);color:var(--cyan)}.event{display:grid;grid-template-columns:80px 1fr 90px 80px;align-items:center;gap:10px;border-top:1px solid var(--line);padding:13px 0}.event small{color:var(--muted)}.pill{font-size:.76rem;text-align:center;border:1px solid var(--line);border-radius:99px;padding:4px}.ok{color:var(--cyan)}.slow{color:var(--amber)}.fail{color:var(--red)}.replay{color:var(--cyan)}@media(max-width:650px){.metrics{grid-template-columns:1fr}.event{grid-template-columns:70px 1fr}.event .replay{grid-column:2}.top small{display:none}}</style></head><body><main class="app"><header class="top"><div class="brand">TRACE<i>BOARD</i></div><small>api.reliability.console / demo stream</small></header><h1>Know what your<br><span style="color:var(--cyan)">APIs are doing.</span></h1><p class="lead">A client-side reliability surface for observing request health, locating trouble, and safely replaying failed deliveries.</p><section class="metrics"><div class="metric"><small>Requests / min</small><b id="rpm">1,284</b></div><div class="metric"><small>P95 latency</small><b id="latency">241ms</b></div><div class="metric"><small>Error budget</small><b>99.86%</b></div></section><section class="feed"><h2>Request stream</h2><div class="filters"><button class="filter active" data-filter="All">All</button><button class="filter" data-filter="Failed">Failed</button><button class="filter" data-filter="Slow">Slow</button></div><div id="events"></div></section></main><script>let filter='All',n=1284;const endpoints=['POST /webhooks/receive','GET /accounts/summary','POST /exports/run','PATCH /orders/1042','GET /inventory/lookup'];let events=[['09:41:03','POST /webhooks/receive','Failed','504ms'],['09:40:58','GET /accounts/summary','Healthy','122ms'],['09:40:55','POST /exports/run','Slow','913ms'],['09:40:49','PATCH /orders/1042','Healthy','208ms'],['09:40:43','GET /inventory/lookup','Healthy','178ms']];const draw=()=>{document.querySelector('#events').innerHTML=events.filter(e=>filter==='All'||e[2]===filter).map((e,i)=>`<div class="event"><small>${e[0]}</small><div><b>${e[1]}</b><br><small>req_${Math.floor(6800+i*14)}</small></div><span class="pill ${e[2]==='Healthy'?'ok':e[2]==='Slow'?'slow':'fail'}">${e[2]}</span><button class="replay" ${e[2]!=='Failed'?'disabled':''} onclick="replay(${i})">Replay</button></div>`).join('')||'<p class="lead">No matching events.</p>'};window.replay=i=>{let all=events.filter(e=>filter==='All'||e[2]===filter),target=all[i];target[2]='Healthy';target[3]='154ms';draw()};document.querySelectorAll('.filter').forEach(x=>x.onclick=()=>{document.querySelectorAll('.filter').forEach(y=>y.classList.remove('active'));x.classList.add('active');filter=x.dataset.filter;draw()});setInterval(()=>{n+=Math.floor(Math.random()*13)-5;document.querySelector('#rpm').textContent=n.toLocaleString();document.querySelector('#latency').textContent=(190+Math.floor(Math.random()*90))+'ms'},1800);draw()</script></body></html>
